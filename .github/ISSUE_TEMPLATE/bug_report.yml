name: Bug report
description: Something doesn't work as expected
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a 1080p MP4
        2. Split at 00:05
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 142
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and GPU
      placeholder: Windows 11, NVIDIA RTX 3060
  - type: dropdown
    id: backend
    attributes:
      label: Rendering backend (shown top-right)
      options: [WebGPU, Canvas 2D, Not sure]
  - type: textarea
    id: media
    attributes:
      label: Media details
      description: Container, codec and resolution if known. Attach a short sample if you can.
